[mgr]
# https://yazi-rs.github.io/docs/configuration/overview/#mixing
# prepend_keymap = []
append_keymap = []

# Close input by once `Esc` press
# https://yazi-rs.github.io/docs/tips/#close-input-by-esc
[[input.prepend_keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel input"

# `cd` (<g-r>) back to the root of the current Git repository
# https://yazi-rs.github.io/docs/tips/#cd-to-git-root
[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'

# macOS: Preview files with the system Quick Look
# https://yazi-rs.github.io/docs/tips/#macos-quick-look
[[mgr.prepend_keymap]]
on = "<C-p>"
run = "shell -- qlmanage -p %s"
