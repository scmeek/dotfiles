#--------------------------------------------------------------------------
# General config
#--------------------------------------------------------------------------

set-option -g renumber-windows on


# Fix Home and End keys
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Restore bindings used by vim-tmux-navigator
bind C-l send-keys 'C-l'  # Clear screen
bind C-\\ send-keys 'C-\'  # SIGQUIT

set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=14:pane_title}\" %a %b %d %I:%M %p %Z"

set -g extended-keys on
set -g extended-keys-format csi-u

# Thicker pane borders
set -g pane-border-lines heavy

# Highlight the active pane
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour39"


#--------------------------------------------------------------------------
# Panes
#--------------------------------------------------------------------------

# Select local panes after the prefix, including when Ctrl is held.
# Unprefixed Ctrl-H/J/K/L still forward through SSH via vim-tmux-navigator.
bind-key -r -T prefix h select-pane -L
bind-key -r -T prefix j select-pane -D
bind-key -r -T prefix k select-pane -U
bind-key -r -T prefix l select-pane -R
bind-key -r -T prefix C-h select-pane -L
bind-key -r -T prefix C-j select-pane -D
bind-key -r -T prefix C-k select-pane -U
bind-key -r -T prefix C-l select-pane -R

# Resize local panes with prefix arrows, including when Ctrl is held.
bind-key -r -T prefix Left resize-pane -L 2
bind-key -r -T prefix Down resize-pane -D 2
bind-key -r -T prefix Up resize-pane -U 2
bind-key -r -T prefix Right resize-pane -R 2
bind-key -r -T prefix C-Left resize-pane -L 2
bind-key -r -T prefix C-Down resize-pane -D 2
bind-key -r -T prefix C-Up resize-pane -U 2
bind-key -r -T prefix C-Right resize-pane -R 2

# Split bindings
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Hide / restore pane
bind-key b break-pane -d -n _hidden_pane
bind-key r join-pane -h -s $.0


#--------------------------------------------------------------------------
# Easier copy
#--------------------------------------------------------------------------

# https://unix.stackexchange.com/a/318285
# macOS only
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


#--------------------------------------------------------------------------
# Neovim
#--------------------------------------------------------------------------

set-option -ga terminal-overrides ",${TERM}:RGB"

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Restore the outer terminal's configured default cursor.
set -as terminal-overrides ',*:Se=\E[0 q'
