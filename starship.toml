# version: 1.0.0

add_newline = false
continuation_prompt = "[▸▹ ](dimmed white)"

format = """\n($nix_shell$container$fill$cmd_duration$git_metrics$time\n)\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$username\
$sudo\
$character"""

right_format = """
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery"""

[fill]
symbol = " "

[character]
format = "$symbol "
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"
vimcmd_symbol = "[■](bold dimmed green)"
# not supported in zsh
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = "green italic"

[sudo]
format = "[$symbol]($style)"
style = "bold bright-purple"
symbol = "!"
disabled = false

[username]
style_user = "bright-yellow bold italic"
style_root = "purple bold italic"
format = "[⭘ $user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = "󰠧 "
truncation_length = 2
truncation_symbol = "  "
read_only = "  "
use_os_path_sep = true
style = "italic blue"
format = "[$path]($style)[$read_only]($read_only_style)"
repo_root_style = "bold blue"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"

[cmd_duration]
format = "[⧖ $duration](dimmed white)"

[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "[▶](blue italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold magenta)"
disabled = false

[time]
disabled = false
format = "[    $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "white"

[battery]
disabled = true
format = "[  $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"

[git_branch]
format = "  [](bright-green) [$branch(:$remote_branch)]($style)"
symbol = "[△](bold bright-green)"
style = "bright-green"
truncation_symbol = "⋯"
truncation_length = 16
# ignore_branches = ["main", "master"]
only_attached = true

[git_metrics]
disabled = false
format = "(  [▴ $added]($added_style))([▿ $deleted]($deleted_style))"
added_style = "green"
deleted_style = "red"
ignore_submodules = true

[git_status]
disabled = true
style = "bold italic bright-blue"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic bright-magenta)"
ahead = "[▴│[${count}](bold white)│](italic green)"
behind = "[▿│[${count}](bold white)│](italic red)"
diverged = "[◇ ▴┤[${ahead_count}](regular white)│▿┤[${behind_count}](regular white)│](italic bright-magenta)"
untracked = "[◌◦](italic bright-yellow)"
stashed = "[◃◈](italic white)"
modified = "[●◦](italic yellow)"
staged = "[▪┤[$count](bold white)│](italic bright-cyan)"
renamed = "[◎◦](italic bright-blue)"
deleted = "[✕](italic red)"

[deno]
format = "  [deno]($style) [$version]($style)"
version_format = "${raw}"
style = "italic green"

[lua]
format = "  [lua]($style) [${version}]($style)"
version_format = "${raw}"
symbol = "⨀ "
style = "italic bright-yellow"

[nodejs]
format = "  [node]($style) [($version)]($style)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []
style = "italic bright-green"

[python]
format = "  [py]($style) [${version}]($style)"
symbol = "[⌉](bold bright-blue)⌊ "
version_format = "${raw}"
style = "italic bright-yellow"

[ruby]
format = "  [rb]($style) [${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "italic red"

[rust]
format = "  [rust]($style) [$version]($style)"
symbol = "⊃ "
version_format = "${raw}"
style = "italic red"

[package]
disabled = true
format = "  [v($version)]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed yellow"

[swift]
format = "  [sw]($style) [${version}]($style)"
symbol = "◁ "
style = "italic bright-red"
version_format = "${raw}"

[aws]
disabled = true
format = "  [aws]($style) [$profile $region]($style)"
style = "style blue"
symbol = "▲ "

[buf]
symbol = "■ "
format = "  [buf]($style) [$version $buf_version]($style)"
style = "italic blue"

[c]
symbol = "ℂ "
format = "  [c]($style) [($version(-$name))]($style)"
style = "italic blue"

[cpp]
symbol = "ℂ "
format = "  [c++]($style) [($version(-$name))]($style)"
style = "italic bright-blue"

[conda]
symbol = "◯ "
format = "  [conda]($style) [$environment]($style)"
style = "italic yellow"

[pixi]
symbol = "■ "
format = "  [pixi]($style) [$version ($environment )]($style)"
style = "italic green"

[dart]
symbol = "◁◅ "
format = "  [dart]($style) [($version )]($style)"
style = "italic yellow"

[docker_context]
symbol = "◧ "
format = "  [docker]($style [$context]($style)"
style = "italic bright-blue"

[elixir]
symbol = "△ "
format = "  [exs]($style) [$version OTP $otp_version ]($style)"
style = "italic purple"

[elm]
symbol = "◩ "
format = "  [elm]($style) [($version )]($style)"
style = "italic cyan"

[golang]
symbol = "∩ "
format = "  [go]($style) [($version )]($style)"
style = "italic cyan"

[haskell]
symbol = "❯λ "
format = "  [hs]($style) [($version )]($style)"
style = "italic bright-purple"

[java]
symbol = "∪ "
format = "  [java]($style) [(${version} )]($style)"
style = "italic bright-yellow"

[julia]
symbol = "◎ "
format = "  [jl]($style) [($version )]($style)"
style = "italic red"

[memory_usage]
symbol = "▪▫▪ "
format = "  mem [${ram}( ${swap})]($style)"

[nim]
symbol = "▴▲▴ "
format = "  [nim]($style) [($version )]($style)"
style = "italic bright-black"

[nix_shell]
style = "bold italic dimmed blue"
symbol = "✶"
format = "[$symbol nix⎪$state⎪]($style) [$name](italic dimmed white)"
impure_msg = "[⌽](bold dimmed red)"
pure_msg = "[⌾](bold dimmed green)"
unknown_msg = "[◌](bold dimmed yellow)"

[spack]
symbol = "◇ "
format = " spack [$symbol$environment]($style)"
